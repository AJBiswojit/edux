openapi: "3.1.0"
info:
  title: "Education Intelligence Platform API"
  version: "0.1.0"
  description: >
    API contract generated from the current frontend implementation.
    This specification describes the current prototype contract and is
    intended as the foundation for the future Python backend.
servers:
  - url: "/api"
    description: "Future backend base path"
tags:
  - name: "AI Workspace"
    description: "Endpoints belonging to the AI Workspace domain"
  - name: "Academic DNA"
    description: "Endpoints belonging to the Academic DNA domain"
  - name: "Admin"
    description: "Endpoints belonging to the Admin domain"
  - name: "Authentication"
    description: "Endpoints belonging to the Authentication domain"
  - name: "Exam Agent"
    description: "Endpoints belonging to the Exam Agent domain"
  - name: "Exam Analysis"
    description: "Endpoints belonging to the Exam Analysis domain"
  - name: "Faculty AI Studio"
    description: "Endpoints belonging to the Faculty AI Studio domain"
  - name: "Faculty Academic Intelligence"
    description: "Endpoints belonging to the Faculty Academic Intelligence domain"
  - name: "Faculty Students"
    description: "Endpoints belonging to the Faculty Students domain"
  - name: "Faculty Workspace"
    description: "Endpoints belonging to the Faculty Workspace domain"
  - name: "Institution Intelligence"
    description: "Endpoints belonging to the Institution Intelligence domain"
  - name: "Interventions"
    description: "Endpoints belonging to the Interventions domain"
  - name: "PYQ Intelligence"
    description: "Endpoints belonging to the PYQ Intelligence domain"
  - name: "Paper Generator"
    description: "Endpoints belonging to the Paper Generator domain"
  - name: "Parent"
    description: "Endpoints belonging to the Parent domain"
  - name: "Platform"
    description: "Endpoints belonging to the Platform domain"
  - name: "Practice"
    description: "Endpoints belonging to the Practice domain"
  - name: "Question Bank"
    description: "Endpoints belonging to the Question Bank domain"
  - name: "Question Intelligence"
    description: "Endpoints belonging to the Question Intelligence domain"
  - name: "Question Studio"
    description: "Endpoints belonging to the Question Studio domain"
  - name: "Re-tests"
    description: "Endpoints belonging to the Re-tests domain"
  - name: "Reports"
    description: "Endpoints belonging to the Reports domain"
  - name: "Similar Issues"
    description: "Endpoints belonging to the Similar Issues domain"
  - name: "Student 360"
    description: "Endpoints belonging to the Student 360 domain"
  - name: "Student Academics"
    description: "Endpoints belonging to the Student Academics domain"
  - name: "Student Mentor"
    description: "Endpoints belonging to the Student Mentor domain"
paths:
  '/auth/forgot-password':
    post:
      operationId: "post_auth_forgot_password"
      summary: "POST /auth/forgot-password"
      description: "Initiate password reset flow for student/faculty/admin users, generating a demo verification token and OTP."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  message:
                    type: "string"
                    example: "If an account exists for that email, a reset link has been sent."
                  verificationId:
                    type: "string"
                    example: "otp_demo_4821"
                  demoOtp:
                    type: "string"
                    example: "482193"
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "email"
              properties:
                email:
                  type: "string"
                  format: "email"
                  description: "Registered email address of user"
                  example: "aravind.swamy@meridian.edu"
  '/auth/verify-otp':
    post:
      operationId: "post_auth_verify_otp"
      summary: "POST /auth/verify-otp"
      description: "Verify 6-digit OTP code submitted during account recovery / password reset flow."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  token:
                    type: "string"
                    example: "otp_verified"
        400:
          description: "Invalid OTP code"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Invalid OTP. Check the code and try again."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "otp"
              properties:
                otp:
                  type: "string"
                  description: "6-digit OTP code (demo expects '482193')"
                  example: "482193"
                verificationId:
                  type: "string"
                  description: "Verification ID"
                  example: "otp_demo_4821"
  '/auth/reset-password':
    post:
      operationId: "post_auth_reset_password"
      summary: "POST /auth/reset-password"
      description: "Update user password following successful OTP verification."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  message:
                    type: "string"
                    example: "Password updated. You can now sign in."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "password"
              properties:
                password:
                  type: "string"
                  format: "password"
                  description: "New password string"
                  example: "aurora123"
                confirmPassword:
                  type: "string"
                  format: "password"
                  description: "Confirmation matching password"
                  example: "aurora123"
                token:
                  type: "string"
                  description: "OTP verification token"
                  example: "otp_verified"
  '/auth/verify-email':
    post:
      operationId: "post_auth_verify_email"
      summary: "POST /auth/verify-email"
      description: "Verify user email address using confirmation code."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  verified:
                    type: "boolean"
                    example: true
        400:
          description: "Verification code incorrect"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Verification code incorrect."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "otp"
              properties:
                otp:
                  type: "string"
                  description: "Email verification code (demo expects '731205')"
                  example: "731205"
                email:
                  type: "string"
                  format: "email"
                  description: "Email being verified"
                  example: "student@meridian.edu"
  '/auth/resend-otp':
    post:
      operationId: "post_auth_resend_otp"
      summary: "POST /auth/resend-otp"
      description: "Resend OTP verification code for email verification or sign-in challenge."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  message:
                    type: "string"
                    example: "OTP re-sent."
                  demoOtp:
                    type: "string"
                    example: "731205"
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  description: "Target email address"
                  example: "student@meridian.edu"
  '/auth/registration/options':
    get:
      operationId: "get_auth_registration_options"
      summary: "GET /auth/registration/options"
      description: "Retrieve canonical catalog options for student self-registration wizard (degrees, branches, semesters, competitive exams, categories)."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  degrees:
                    type: "array"
                    items:
                      type: "string"
                    example:
                      - "B.Tech"
                      - "B.Sc"
                      - "M.Tech"
                  branches:
                    type: "object"
                    description: "Degree-to-branches mapping dictionary"
                    example:
                      B.Tech:
                        - "Computer Science & Engineering"
                        - "Information Technology"
                        - "Electronics & Communication"
                  semesters:
                    type: "array"
                    items:
                      type: "string"
                    example:
                      - "Semester 1"
                      - "Semester 2"
                      - "Semester 3"
                      - "Semester 4"
                      - "Semester 5"
                      - "Semester 6"
                      - "Semester 7"
                      - "Semester 8"
                  competitiveExams:
                    type: "array"
                    items:
                      type: "string"
                    example:
                      - "JEE Main"
                      - "JEE Advanced"
                      - "NEET UG"
                      - "GATE"
                  categories:
                    type: "array"
                    items:
                      type: "string"
                    example:
                      - "General"
                      - "OBC-NCL"
                      - "SC"
                      - "ST"
                      - "EWS"
  '/auth/register':
    post:
      operationId: "post_auth_register"
      summary: "POST /auth/register"
      description: "Create a draft student registration, validate duplicate email/phone against demo users and in-browser registry, and issue demo OTP."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  verificationId:
                    type: "string"
                    example: "otp_demo_4821"
                  demoOtp:
                    type: "string"
                    example: "482193"
                  draftId:
                    type: "string"
                    example: "u_stu_1724425200000"
        409:
          description: "Phone number already registered"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "This mobile number is already registered."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "email"
                - "fullName"
                - "password"
              properties:
                fullName:
                  type: "string"
                  description: "Student full name"
                  example: "Rohan Deshmukh"
                email:
                  type: "string"
                  format: "email"
                  description: "Unique student email"
                  example: "rohan.deshmukh@gmail.com"
                phone:
                  type: "string"
                  description: "Student phone number"
                  example: "9876543210"
                password:
                  type: "string"
                  format: "password"
                  description: "Account password"
                  example: "aurora123"
                category:
                  type: "string"
                  description: "Student category"
                  example: "General"
                university:
                  type: "object"
                  properties:
                    degree:
                      type: "string"
                      example: "B.Tech"
                    branch:
                      type: "string"
                      example: "Computer Science & Engineering"
                    semester:
                      type: "string"
                      example: "Semester 5"
                    institution:
                      type: "string"
                      example: "Meridian Institute of Technology"
                    roll:
                      type: "string"
                      example: "2024CS1099"
                competitive:
                  type: "object"
                  properties:
                    targetExam:
                      type: "string"
                      example: "JEE Main"
                    targetYear:
                      type: "string"
                      example: "2026"
                    category:
                      type: "string"
                      example: "General"
  '/auth/register/verify':
    post:
      operationId: "post_auth_register_verify"
      summary: "POST /auth/register/verify"
      description: "Verify student registration OTP and activate user registration record in the in-browser registry."
      tags:
        - "Authentication"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  verified:
                    type: "boolean"
                    example: true
        400:
          description: "Invalid code"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Invalid code. Use the demo OTP 482193."
        404:
          description: "Registration session not found"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Registration session not found — please register again."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "email"
                - "otp"
              properties:
                email:
                  type: "string"
                  format: "email"
                  description: "Registered student email"
                  example: "rohan.deshmukh@gmail.com"
                otp:
                  type: "string"
                  description: "Registration OTP code (demo expects '482193')"
                  example: "482193"
  '/platform/blog':
    get:
      operationId: "get_platform_blog"
      summary: "GET /platform/blog"
      description: "Retrieve list of public platform blog posts."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  posts:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          example: "p1"
                        title:
                          type: "string"
                          example: "Transforming STEM Education with Diagnostic AI"
                        summary:
                          type: "string"
                          example: "How continuous behavioral assessment detects latent conceptual gaps."
                        category:
                          type: "string"
                          example: "Pedagogy"
                        author:
                          type: "string"
                          example: "Dr. Aris Thorne"
                        date:
                          type: "string"
                          example: "2026-08-15"
                        readTime:
                          type: "string"
                          example: "6 min read"
                        cover:
                          type: "string"
                          example: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
  '/platform/blog/{id}':
    get:
      operationId: "get_platform_blog__id"
      summary: "GET /platform/blog/:id"
      description: "Retrieve single blog post article by ID (falls back to default post if ID not matched)."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  post:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        example: "p1"
                      title:
                        type: "string"
                        example: "Transforming STEM Education with Diagnostic AI"
                      content:
                        type: "string"
                        example: "Detailed article body content..."
                      author:
                        type: "string"
                        example: "Dr. Aris Thorne"
                      date:
                        type: "string"
                        example: "2026-08-15"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Blog post unique ID"
          schema:
            type: "string"
  '/platform/careers':
    get:
      operationId: "get_platform_careers"
      summary: "GET /platform/careers"
      description: "Retrieve platform open careers and employment opportunities."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  roles:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          example: "c1"
                        title:
                          type: "string"
                          example: "Senior AI Assessment Engineer"
                        department:
                          type: "string"
                          example: "Intelligence & ML"
                        location:
                          type: "string"
                          example: "Bengaluru / Hybrid"
                        type:
                          type: "string"
                          example: "Full-time"
                        experience:
                          type: "string"
                          example: "4-7 years"
  '/platform/case-studies':
    get:
      operationId: "get_platform_case_studies"
      summary: "GET /platform/case-studies"
      description: "Retrieve institutional case studies and platform adoption impact reports."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  studies:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          example: "cs1"
                        institution:
                          type: "string"
                          example: "National Institute of Technology, Calicut"
                        title:
                          type: "string"
                          example: "Closing First-Year Engineering Gaps via Longitudinal DNA"
                        outcome:
                          type: "string"
                          example: "+28% retention in foundational mechanics"
                        metrics:
                          type: "object"
                          example:
                            students: 1420
                            faculty: 48
                            gain: "28%"
  '/platform/contact':
    get:
      operationId: "get_platform_contact"
      summary: "GET /platform/contact"
      description: "Retrieve institutional headquarters, contact addresses, support helplines, and office locations."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  headquarters:
                    type: "string"
                    example: "MediXO EduX HQ, Bengaluru, Karnataka, India"
                  email:
                    type: "string"
                    example: "contact@edux.meridian.edu"
                  phone:
                    type: "string"
                    example: "+91 80 4123 4567"
                  offices:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        city:
                          type: "string"
                          example: "Bengaluru"
                        address:
                          type: "string"
                          example: "Indiranagar 100ft Rd"
    post:
      operationId: "post_platform_contact"
      summary: "POST /platform/contact"
      description: "Submit contact inquiry message from public landing page."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  message:
                    type: "string"
                    example: "Message received — our team will reply within one business day."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "name"
                - "email"
                - "message"
              properties:
                name:
                  type: "string"
                  example: "Vikram Seth"
                email:
                  type: "string"
                  format: "email"
                  example: "vikram@example.com"
                subject:
                  type: "string"
                  example: "Institutional Demo Request"
                message:
                  type: "string"
                  example: "We would like to pilot EduX for our computer science department."
  '/platform/newsletter':
    post:
      operationId: "post_platform_newsletter"
      summary: "POST /platform/newsletter"
      description: "Subscribe user email to platform newsletter and product updates."
      tags:
        - "Platform"
      security: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  message:
                    type: "string"
                    example: "Subscribed! Watch your inbox for the next issue."
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              required:
                - "email"
              properties:
                email:
                  type: "string"
                  format: "email"
                  description: "Subscriber email address"
                  example: "user@example.com"
  '/student/mock-tests':
    get:
      operationId: "get_student_mock_tests"
      summary: "GET /student/mock-tests"
      description: "Retrieve list of available academic mock tests and practice simulations for student."
      tags:
        - "Student Academics"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          example: "mt1"
                        title:
                          type: "string"
                          example: "Data Structures Comprehensive Mock 1"
                        subject:
                          type: "string"
                          example: "Data Structures & Algorithms"
                        duration:
                          type: "number"
                          example: 90
                        totalQuestions:
                          type: "number"
                          example: 45
                        marks:
                          type: "number"
                          example: 100
                        difficulty:
                          type: "string"
                          example: "Medium"
  '/student/exams':
    get:
      operationId: "get_student_exams"
      summary: "GET /student/exams"
      description: "Retrieve student scheduled examinations, upcoming university exams, and competitive test series."
      tags:
        - "Student Academics"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          example: "ex1"
                        name:
                          type: "string"
                          example: "CS501 Mid-Semester Examination"
                        code:
                          type: "string"
                          example: "CS501"
                        date:
                          type: "string"
                          example: "2026-09-12"
                        time:
                          type: "string"
                          example: "10:00 AM"
                        duration:
                          type: "string"
                          example: "120 mins"
                        venue:
                          type: "string"
                          example: "Hall 302"
                        status:
                          type: "string"
                          example: "Scheduled"
  '/student/settings':
    get:
      operationId: "get_student_settings"
      summary: "GET /student/settings"
      description: "Retrieve student account configuration, notifications preferences, and theme settings."
      tags:
        - "Student Academics"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  profile:
                    type: "object"
                    properties:
                      name:
                        type: "string"
                        example: "Aarav Sharma"
                      email:
                        type: "string"
                        example: "aarav.sharma@meridian.edu"
                      avatar:
                        type: "string"
                        example: "/avatars/student-1.png"
                  notifications:
                    type: "object"
                    properties:
                      email:
                        type: "boolean"
                        example: true
                      sms:
                        type: "boolean"
                        example: false
                      examAlerts:
                        type: "boolean"
                        example: true
                      interventionAlerts:
                        type: "boolean"
                        example: true
                  appearance:
                    type: "object"
                    properties:
                      theme:
                        type: "string"
                        example: "system"
                      fontSize:
                        type: "string"
                        example: "medium"
    patch:
      operationId: "patch_student_settings"
      summary: "PATCH /student/settings"
      description: "Update student account preferences, notification toggles, and appearance options."
      tags:
        - "Student Academics"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Successful operation"
          content:
            'application/json':
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  settings:
                    type: "object"
                    description: "Updated student settings object"
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: "object"
              description: "Partial settings update object"
              properties:
                notifications:
                  type: "object"
                  example:
                    email: true
                    sms: true
                    examAlerts: true
                appearance:
                  type: "object"
                  example:
                    theme: "dark"
  '/student/programs':
    get:
      operationId: "get_student_programs"
      summary: "GET /student/programs"
      description: "Retrieve academic curriculum, enrolled degree requirements, courses, and elective choices for student."
      tags:
        - "Student Academics"
