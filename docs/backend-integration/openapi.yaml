                            type: "boolean"
                            example: false
                          marksEarned:
                            type: "number"
                            example: 4
                          negativeMarks:
                            type: "number"
                            example: 0
                      timing:
                        type: "object"
                        properties:
                          timeSpent:
                            type: "number"
                            example: 82
                elapsedSeconds:
                  type: "number"
                  example: 5400
                interactions:
                  type: "object"
                  description: "Raw UI telemetry interactions"
                summary:
                  type: "object"
                  properties:
                    attempted:
                      type: "number"
                      example: 60
                    correct:
                      type: "number"
                      example: 48
                    incorrect:
                      type: "number"
                      example: 12
                    skipped:
                      type: "number"
                      example: 15
