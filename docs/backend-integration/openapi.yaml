components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "JWT Bearer token authentication"
  schemas:
    GenericSuccess:
      type: "object"
      properties:
        ok:
          type: "boolean"
          example: true
        message:
          type: "string"
          example: "Operation completed successfully."
    ErrorMessage:
      type: "object"
      properties:
        message:
          type: "string"
          example: "An error occurred."
    QuestionAttempt:
      type: "object"
      description: "Canonical question-level interaction evidence within an ExamAttempt"
      properties:
        questionId:
          type: "string"
          example: "q_jee_phy_001"
        academicContext:
          type: "object"
          properties:
            subject:
              type: "string"
              example: "Physics"
            chapter:
              type: "string"
              example: "Kinematics"
            topic:
              type: "string"
              example: "Projectile Motion"
        response:
          type: "object"
          properties:
            selectedAnswer:
              type: "string"
              example: "B"
            status:
              type: "string"
              example: "answered"
        evaluation:
          type: "object"
          properties:
            isCorrect:
              type: "boolean"
              example: true
            isSkipped:
              type: "boolean"
              example: false
            marksEarned:
              type: "number"
              example: 4
            negativeMarks:
              type: "number"
              example: 0
        timing:
          type: "object"
          properties:
            timeSpent:
              type: "number"
              example: 82
    ExamAttempt:
      type: "object"
      description: "Canonical ExamAttempt data model"
      properties:
        id:
          type: "string"
          example: "ea-attempt-1724425200000"
        studentId:
          type: "string"
          example: "u_stu_001"
        interventionId:
          type: "string"
          nullable: true
          example: null
        roll:
          type: "string"
          example: "2024CS1001"
        examId:
          type: "string"
          example: "ea_jee_full_01"
        examTitle:
          type: "string"
          example: "JEE Main Full Mock 1"
        shortTitle:
          type: "string"
          example: "JEE Main Mock 1"
        examMode:
          type: "string"
          example: "Competitive"
        examFamily:
          type: "string"
          nullable: true
          example: "JEE"
        examType:
          type: "string"
          example: "Full Mock"
        category:
          type: "string"
          example: "Engineering"
        subject:
          type: "string"
          example: "PCM"
        mode:
          type: "string"
          example: "manual"
        source:
          type: "string"
          example: "exam-agent"
        startedAt:
          type: "string"
          example: "2026-08-23T14:00:00.000Z"
        submittedAt:
          type: "string"
          example: "2026-08-23T15:30:00.000Z"
        completedAt:
          type: "string"
          example: "2026-08-23T15:30:00.000Z"
        scoring:
          type: "object"
          properties:
            score:
              type: "number"
              example: 184
            maxScore:
              type: "number"
              example: 300
            accuracy:
              type: "number"
              example: 78.5
        timing:
          type: "object"
          properties:
            elapsedSeconds:
              type: "number"
              example: 5400
        questionAttempts:
          type: "array"
          items:
            $ref: "#/components/schemas/QuestionAttempt"