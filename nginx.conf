# Nginx config for the EduX frontend container.
# Serves the built SPA and reverse-proxies the API under /v1 to the backend.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conservative security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # API — proxy everything under /v1 to the backend service (docker network name "api").
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Backend health passthrough (convenience).
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Hashed Vite assets can be cached for a year; HTML stays revalidated.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Browser navigation for React Router routes falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
